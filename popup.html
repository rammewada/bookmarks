<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Save bookmark</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        width: 360px; margin: 0; padding: 16px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px;
        background: var(--card-bg); color: var(--ink);
      }
      [hidden] { display: none !important; }

      .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .hd-icon {
        width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
        background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green);
      }
      .hd-icon.edit { background: var(--surface-thick); color: var(--ink-dim); }
      .hd-text { flex: 1; font-size: 15px; font-weight: 600; }

      .page { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 14px; border-radius: 8px; background: var(--surface-sub); }
      .page img { width: 16px; height: 16px; flex-shrink: 0; }
      .page-domain { flex: 1; min-width: 0; color: var(--ink-dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .page-note { font-size: 11px; color: var(--amber); white-space: nowrap; }

      .row { display: flex; gap: 6px; align-items: center; }
      .row > select { flex: 1; min-width: 0; }
      #newfolder-row { margin-top: 6px; }

      .opts { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
      .toggle {
        display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 8px;
        border: 1px solid var(--border); background: var(--surface-sub); cursor: pointer; user-select: none; font-size: 13px; white-space: nowrap;
      }
      .toggle input { margin: 0; accent-color: var(--accent); }
      .toggle:has(input:checked) { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
      .opts select { flex: 1; }

      .actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
      .status { flex: 1; font-size: 12px; color: var(--ink-fade); transition: opacity 0.3s; }
      .status.ok { color: var(--green); }

      .foot {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        margin: 16px -16px -16px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface-sub);
      }
      .foot .btn { padding: 6px 10px; font-size: 12px; background: transparent; border-color: transparent; color: var(--ink-dim); }
      .foot .btn:hover { background: var(--surface-thick); color: var(--ink); }
      .shortcut { font-size: 11px; color: var(--ink-fade); }

      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
      .stat { padding: 14px; border-radius: 10px; background: var(--surface-sub); text-align: center; }
      .stat b { display: block; font-size: 22px; font-weight: 600; }
      .stat span { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.05em; }
      .lib-msg { color: var(--ink-dim); margin: 0 0 12px; line-height: 1.45; }
      .full { width: 100%; }
    </style>
  </head>
  <body>
    <!-- Save / edit the current page -->
    <section id="save-view" hidden>
      <div class="hd">
        <div class="hd-icon" id="hd-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>
        </div>
        <div class="hd-text" id="hd-text">Bookmark added</div>
        <button class="icon-btn" id="btn-library" title="Open library">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /></svg>
        </button>
      </div>

      <div class="page">
        <img id="pg-icon" alt="" />
        <div class="page-domain" id="pg-domain"></div>
        <div class="page-note" id="pg-note" hidden></div>
      </div>

      <label class="field"><span>Name</span><input id="f-title" type="text" /></label>

      <div class="field">
        <span class="field-label">Folder</span>
        <div class="row">
          <select id="f-folder" class="select"></select>
          <button class="icon-btn" id="btn-newfolder" title="New folder inside the selected one">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" /><line x1="12" y1="11" x2="12" y2="17" /><line x1="9" y1="14" x2="15" y2="14" /></svg>
          </button>
        </div>
        <div class="row" id="newfolder-row" hidden>
          <input id="f-newfolder" class="input" type="text" placeholder="New folder name — press Enter" />
        </div>
      </div>

      <div class="field">
        <span class="field-label">Tags</span>
        <div id="f-tags"></div>
        <div class="quick-tags" id="quick-tags"></div>
      </div>

      <label class="field"><span>Note</span><textarea id="f-notes" rows="2" placeholder="Why are you saving this?"></textarea></label>

      <div class="opts">
        <label class="toggle"><input type="checkbox" id="f-pin" /> Pin</label>
        <select id="f-remind" class="select" title="Remind me to read this later">
          <option value="0">No reminder</option>
          <option value="60">Remind in 1 hour</option>
          <option value="180">Remind in 3 hours</option>
          <option value="480">Remind tonight</option>
          <option value="1440">Remind tomorrow</option>
          <option value="10080">Remind next week</option>
        </select>
      </div>

      <div class="actions">
        <button class="btn btn-danger" id="btn-remove">Remove</button>
        <span class="status" id="status"></span>
        <button class="btn btn-primary" id="btn-done">Done</button>
      </div>
    </section>

    <!-- Shown on pages that cannot be bookmarked (e.g. the library itself) -->
    <section id="lib-view" hidden>
      <div class="hd"><div class="hd-text">Bookmark Organizer</div></div>
      <div class="stats">
        <div class="stat"><b id="total-count">—</b><span>Links</span></div>
        <div class="stat"><b id="folder-count">—</b><span>Folders</span></div>
      </div>
      <p class="lib-msg">This page can't be bookmarked. Open the library to browse and organize everything.</p>
      <button class="btn btn-primary full" id="btn-open">Open library</button>
    </section>

    <div class="foot">
      <button class="btn" id="btn-save-tabs" title="Save every tab in this window into a new folder">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" /><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" /></svg>
        <span id="save-tabs-label">Save all tabs</span>
      </button>
      <span class="shortcut" id="shortcut"></span>
    </div>

    <script src="lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
